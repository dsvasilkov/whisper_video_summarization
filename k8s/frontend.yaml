apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-frontend
  namespace: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-frontend
  template:
    metadata:
      labels:
        app: whisper-frontend
    spec:
      containers:
        - name: frontend
          image: whisper-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-frontend
  namespace: whisper
spec:
  selector:
    app: whisper-frontend
  ports:
    - port: 80
      targetPort: 80

