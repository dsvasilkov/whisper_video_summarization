# Worker очереди rag: индекс Qdrant, эмбеддинги, RAG+Q&A через vLLM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-worker-rag
  namespace: whisper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper-worker-rag
  template:
    metadata:
      labels:
        app: whisper-worker-rag
    spec:
      containers:
        - name: worker-rag
          image: whisper-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9102
          volumeMounts:
            - name: uploads
              mountPath: /app/data
          command:
            - aio_celery
            - worker
            - whisper_video_summarization.celery_app.app:celery_app
            - -Q
            - rag
            - -l
            - INFO
            - --concurrency=1
          resources:
            requests:
              memory: "6Gi"
              cpu: "2"
            limits:
              memory: "10Gi"
              cpu: "4"
          env:
            - name: PYTHONPATH
              value: /app
            - name: DATABASE_URL
              value: postgresql+psycopg2://postgres:postgres@postgres.whisper.svc.cluster.local:5432/whisper_inference
            - name: CELERY_BROKER_URL
              value: amqp://guest:guest@rabbitmq.whisper.svc.cluster.local:5672//
            - name: CELERY_RESULT_BACKEND
              value: redis://redis.whisper.svc.cluster.local:6379/0
            - name: QDRANT_URL
              value: http://qdrant.whisper.svc.cluster.local:6333
            - name: VLLM_LLM_BASE_URL
              value: http://vllm-llm.whisper.svc.cluster.local:8000/v1
            - name: RAG_EMBEDDINGS_SERVE_URL
              value: http://ray-serve.whisper.svc.cluster.local:8000/embeddings
            - name: HF_HOME
              value: /app/data/hf
            - name: WORKER_METRICS_PORT
              value: "9102"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc_rag
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: whisper-uploads

---
apiVersion: v1
kind: Service
metadata:
  name: whisper-worker-rag-metrics
  namespace: whisper
spec:
  selector:
    app: whisper-worker-rag
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
