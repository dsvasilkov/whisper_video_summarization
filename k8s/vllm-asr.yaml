apiVersion: v1
kind: Service
metadata:
  name: vllm-asr
  namespace: whisper
spec:
  selector:
    app: vllm-asr
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-asr
  namespace: whisper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-asr
  template:
    metadata:
      labels:
        app: vllm-asr
    spec:
      containers:
        - name: vllm-asr
          image: whisper-vllm:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_HOME
              value: /app/data/.cache/huggingface
            # WAVs can be large; keep in sync with Dockerfile.vllm
            - name: VLLM_MAX_AUDIO_CLIP_FILESIZE_MB
              value: "512"
          volumeMounts:
            - name: uploads
              mountPath: /app/data
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --model
            - Systran/faster-whisper-large-v3
            - --gpu-memory-utilization
            - "0.3"
            - --max-num-seqs
            - "4"
            # Whisper (multimodal): must be >= max_tokens_per_mm_item (~1500); else:
            # ValueError: ... max_tokens_per_mm_item (1500) is larger than max_num_batched_tokens (896)
            - --max-num-batched-tokens
            - "2048"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: "2"
              memory: "10Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: 1
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: whisper-uploads

