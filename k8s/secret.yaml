# Подставьте свой Hugging Face токен и примените:
#   kubectl apply -f k8s/secret.yaml
#
# Совпадает с k8s/ray-serve.yaml (secretKeyRef: pyannote-secrets / PYANNOTE_HF_TOKEN).

---
apiVersion: v1
kind: Namespace
metadata:
  name: whisper

---
apiVersion: v1
kind: Secret
metadata:
  name: pyannote-secrets
  namespace: whisper
type: Opaque
stringData:
  # Создайте токен на https://huggingface.co/settings/tokens и подставьте сюда (не коммитьте реальный токен).
  PYANNOTE_HF_TOKEN: "__REPLACE_WITH_YOUR_HUGGINGFACE_TOKEN__"
