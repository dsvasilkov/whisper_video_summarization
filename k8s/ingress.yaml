apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whisper-ingress
  namespace: whisper
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
spec:
  ingressClassName: nginx
  rules:
    - host: whisper.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: whisper-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whisper-frontend
                port:
                  number: 80

