# Worker для очереди llm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-worker-llm
  namespace: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-worker-llm
  template:
    metadata:
      labels:
        app: whisper-worker-llm
    spec:
      containers:
        - name: worker-llm
          image: whisper-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9101
          volumeMounts:
            - name: uploads
              mountPath: /app/data
          command:
            - aio_celery
            - worker
            - whisper_video_summarization.celery_app.app:celery_app
            - -Q
            - llm
            - -l
            - INFO
            - --concurrency=1
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "6Gi"
              cpu: "4"
          env:
            - name: PYTHONPATH
              value: /app
            - name: DATABASE_URL
              value: postgresql+psycopg2://postgres:postgres@postgres.whisper.svc.cluster.local:5432/whisper_inference
            - name: CELERY_BROKER_URL
              value: amqp://guest:guest@rabbitmq.whisper.svc.cluster.local:5672//
            - name: VLLM_LLM_BASE_URL
              value: http://vllm-llm.whisper.svc.cluster.local:8000/v1
            - name: WORKER_METRICS_PORT
              value: "9101"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: whisper-uploads

---
apiVersion: v1
kind: Service
metadata:
  name: whisper-worker-llm-metrics
  namespace: whisper
spec:
  selector:
    app: whisper-worker-llm
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
