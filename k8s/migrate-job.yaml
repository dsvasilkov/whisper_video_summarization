# Одноразовая миграция PostgreSQL (Alembic: python -m whisper_video_summarization.db.migrate).
# Порядок: namespace → postgres → этот Job → API / worker.
# Повторный apply: kubectl delete job whisper-db-migrate -n whisper && kubectl apply -f k8s/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: whisper-db-migrate
  namespace: whisper
  labels:
    app: whisper-db-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: whisper-db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: whisper-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONPATH
              value: /app
            - name: DATABASE_URL
              value: postgresql+psycopg2://postgres:postgres@postgres.whisper.svc.cluster.local:5432/whisper_inference
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for PostgreSQL..."
              i=0
              # Bitnami PostgreSQL может инициализироваться дольше обычного.
              # 120 попыток * 2 секунды = до ~4 минут.
              while [ "$i" -lt 120 ]; do
                if nc -z postgres.whisper.svc.cluster.local 5432; then
                  echo "PostgreSQL is reachable"
                  exec python -m whisper_video_summarization.db.migrate
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "Timeout waiting for PostgreSQL"
              exit 1
