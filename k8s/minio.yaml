apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: whisper
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
  MINIO_WEBHOOK_TOKEN: change-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: whisper
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          envFrom:
            - secretRef:
                name: minio-secrets
          env:
            # Notify backend when objects are created (direct uploads from frontend).
            # MinIO sends S3 event JSON to this endpoint.
            - name: MINIO_NOTIFY_WEBHOOK_ENABLE_api
              value: "on"
            - name: MINIO_NOTIFY_WEBHOOK_ENDPOINT_api
              value: http://whisper-api.whisper.svc.cluster.local:8000/api/minio/events
            - name: MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_api
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_WEBHOOK_TOKEN
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: whisper
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

