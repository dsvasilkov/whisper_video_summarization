---
apiVersion: v1
kind: Secret
metadata:
  name: pyannote-secrets
  namespace: whisper
type: Opaque
stringData:
  PYANNOTE_HF_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-worker-pyannote
  namespace: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-worker-pyannote
  template:
    metadata:
      labels:
        app: whisper-worker-pyannote
    spec:
      containers:
        - name: worker-pyannote
          image: whisper-worker-pyannote:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9101
          volumeMounts:
            - name: uploads
              mountPath: /app/data
          command:
            - aio_celery
            - worker
            - whisper_video_summarization.celery_app.app:celery_app
            - -Q
            - pyannote
            - -l
            - INFO
            - --concurrency=1
          resources:
            requests:
              memory: "6Gi"
              cpu: "4"
              nvidia.com/gpu: 1
            limits:
              memory: "12Gi"
              cpu: "8"
              nvidia.com/gpu: 1
          env:
            - name: CUDA_MODULE_LOADING
              value: LAZY
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
            - name: NUMEXPR_MAX_THREADS
              value: "4"
            - name: PYTHONPATH
              value: /app
            - name: DATABASE_URL
              value: postgresql+psycopg2://postgres:postgres@postgres.whisper.svc.cluster.local:5432/whisper_inference
            - name: CELERY_BROKER_URL
              value: amqp://guest:guest@rabbitmq.whisper.svc.cluster.local:5672//
            - name: WORKER_METRICS_PORT
              value: "9101"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
            - name: PYANNOTE_ENABLED
              value: "true"
            - name: PYANNOTE_DIARIZATION_MODEL
              value: pyannote/speaker-diarization-3.1
            - name: PYANNOTE_HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pyannote-secrets
                  key: PYANNOTE_HF_TOKEN
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: whisper-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-worker-pyannote-metrics
  namespace: whisper
spec:
  selector:
    app: whisper-worker-pyannote
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
