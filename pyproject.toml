[project]
name = "whisper-video-summarization"
version = "0.1.0"
description = "Whisper Video Summarization project with FastAPI, Prometheus and Grafana"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "fastapi>=0.124.4,<0.125.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
    "requests>=2.32.5,<3.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "python-multipart>=0.0.21,<0.0.22",
    "pyyaml>=6.0.3,<7.0.0",
    "aio-celery>=0.22.0,<0.23.0",
    "psycopg[binary]>=3.2.10,<4.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "hydra-core>=1.3.2,<2.0.0",
    "omegaconf>=2.3.0,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "aiofiles",
    "prometheus-client>=0.23.1,<0.24.0",
    "bcrypt>=4.2.0,<5.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
]

[dependency-groups]
inference = [
    "soundfile>=0.13.1,<0.14.0",
    "openai>=1.60.0,<2.0.0",
]
pyannote = [
    "torch>=2.11.0,<2.12.0",
    "torchaudio>=2.11.0,<2.12.0",
    "pyannote-audio>=4.0.0,<5.0.0",
]
monitoring = [
    "gitpython>=3.1.45,<4.0.0",
    "fsspec>=2025.12.0,<2026.0.0",
    "prometheus-client>=0.23.1,<0.24.0",
    "psutil>=7.1.3,<8.0.0",
    "nvidia-ml-py>=13.580.82,<14.0.0",
]
# Скачивание HF-снапшотов в data/models (scripts/download_vllm_models.py)
models = [
    "huggingface_hub>=0.30.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# PyTorch +cu130 для Linux/Windows (группа inference). На macOS — колёса с PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.setuptools.packages.find]
include = ["whisper_video_summarization*"]
