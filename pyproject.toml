[project]
name = "whisper-video-summarization"
version = "0.1.0"
description = "Whisper Video Summarization project with FastAPI, Prometheus and Grafana"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "fastapi>=0.124.4,<0.125.0",
    "uvicorn[standard]>=0.38.0,<0.39.0",
    "requests>=2.32.5,<3.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "python-multipart>=0.0.21,<0.0.22",
    "pyyaml>=6.0.3,<7.0.0",
    "aio-celery>=0.22.0,<0.23.0",
    "redis>=5.0.0,<6.0.0",
    "aioboto3>=15.0.0,<16.0.0",
    "psycopg[binary]>=3.2.10,<4.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "hydra-core>=1.3.2,<2.0.0",
    "omegaconf>=2.3.0,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "aiofiles",
    "prometheus-client>=0.23.1,<0.24.0",
    "bcrypt>=4.2.0,<5.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
]

[dependency-groups]
inference = [
    "soundfile>=0.13.1,<0.14.0",
    "openai>=1.60.0,<2.0.0",
    "nltk>=3.9.1,<4.0.0",
    "faiss-cpu>=1.12.0,<2.0.0",
    "python-igraph>=0.11.9,<0.12.0",
    "leidenalg>=0.10.2,<0.11.0",
    "qdrant-client>=1.13.3,<2.0.0",
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.3.0",
    "llama-index-retrievers-bm25>=0.3.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "numpy>=1.26",
    "transformers>=4.43,<5",
    "faster-whisper>=1.1.0,<2",
    "llama-index-embeddings-openai>=0.2.0",
]
monitoring = [
    "psutil>=7.1.3,<8.0.0",
    "nvidia-ml-py>=13.580.82,<14.0.0",
]
serve = [
    "ray[serve]>=2.55.1",
    "torch>=2.11.0,<2.12.0",
    "torchaudio>=2.11.0,<2.12.0",
    "pyannote-audio>=4.0.0,<5.0.0",
]

# NPM-зависимости фронтенда (не pip): установка только из frontend/ — см. там package.json.
[tool.whisper_frontend.npm]
"react-markdown" = "^9.1.0"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# PyTorch +cu130 для Linux/Windows (группа inference). На macOS — колёса с PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.setuptools.packages.find]
include = ["whisper_video_summarization*"]
