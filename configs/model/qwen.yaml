type: qwen
name: "cyankiwi/Qwen3.5-2B-AWQ-4bit"

# Soft cap for RAG / long-context paths (see LLM_CONTEXT_MAX_LENGTH env).
# Должен быть не ниже желаемой длины ответа: max_tokens=min(max_new_tokens, context budget).
context_max_length: 8192

# Generation parameters for summarization (финальный конспект может быть развёрнутым).
max_new_tokens: 8192
