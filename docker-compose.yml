services:
  postgres:
    image: postgres:16-alpine
    container_name: whisper-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whisper_inference
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - whisper-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: whisper-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whisper-network

  fastapi:
    build:
      context: .
      args:
        POETRY_GROUPS: "inference,mlops"
    container_name: whisper-fastapi
    command: uvicorn whisper_video_summarization.api.app:app --host 0.0.0.0 --port 8000 --log-level debug
    volumes:
      - .:/app
      - ./mlflow.db:/app/mlflow.db
      - ./data:/app/data
      - ./whisper_video_summarization/models:/app/whisper_video_summarization/models
      - ./configs:/app/configs
      - ./tmp:/app/tmp
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/whisper_inference
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    working_dir: /app
    networks:
      - whisper-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      args:
        POETRY_GROUPS: "inference,mlops"
    container_name: whisper-celery-worker
    command: celery -A whisper_video_summarization.celery_app.app worker -l info
    volumes:
      - .:/app
      - ./data:/app/data
      - ./whisper_video_summarization/models:/app/whisper_video_summarization/models
      - ./configs:/app/configs
      - ./tmp:/app/tmp
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/whisper_inference
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    working_dir: /app
    networks:
      - whisper-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fastapi:
        condition: service_healthy

  mlflow:
    build:
      context: .
      args:
        POETRY_GROUPS: "mlflow"
    container_name: whisper-mlflow
    command: >
      bash -c "mkdir -p /app/mlruns &&
      touch /app/mlflow.db &&
      mlflow server
      --host 0.0.0.0
      --port 8080
      --backend-store-uri sqlite:///app/mlflow.db
      --default-artifact-root /app/mlruns"
    volumes:
      - .:/app
      - ./mlruns:/app/mlruns
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    networks:
      - whisper-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: whisper-frontend
    ports:
      - "5173:80"
    networks:
      - whisper-network
    depends_on:
      fastapi:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  whisper-network:
    driver: bridge
